<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Slicer & Dodger</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a14; overflow: hidden; }
  html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; left: 0; top: 0; display: block; user-select: none; touch-action: none; }
  /* 세로로 든 휴대폰에는 가로로 돌리라고 안내한다 */
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #070a14; color: #dfe8ff; font: 700 22px/1.6 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; padding: 24px; }
  #rotate b { font-size: 54px; display: block; margin-bottom: 12px; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate"><div><b>⟳</b>화면을 가로로 돌려 주세요</div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
